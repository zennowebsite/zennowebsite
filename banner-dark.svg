<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Zenno Web: sites profissionais para pequenos negócios" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0f2a52"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#3b82f6" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- horizonte -->
  <line x1="0" y1="232" x2="1200" y2="232" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- site em construção (linhas tracejadas) -->
  <g transform="translate(850 52)" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="260" height="176" rx="12"/>
    <line x1="0" y1="30" x2="260" y2="30"/>
    <circle cx="18" cy="15" r="3.5"/>
    <circle cx="32" cy="15" r="3.5"/>
    <circle cx="46" cy="15" r="3.5"/>
    <rect x="20" y="50" width="120" height="14" rx="4"/>
    <rect x="20" y="76" width="200" height="8" rx="4"/>
    <rect x="20" y="94" width="170" height="8" rx="4"/>
    <rect x="20" y="124" width="96" height="30" rx="15"/>
  </g>

  <!-- ponto verde aceso: projeto no ar -->
  <circle cx="1090" cy="176" r="46" fill="url(#glow)"/>
  <circle cx="1090" cy="176" r="9" fill="#22c55e"/>

  <!-- textos -->
  <text x="70" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-1">Zenno Web</text>
  <text x="72" y="170" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#bfdbfe">Sites profissionais para pequenos negócios</text>
  <text x="72" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#93c5fd" fill-opacity="0.85">Seu negócio no ar, perto de quem procura.</text>
</svg>
